body{margin:0}
a{color:#B91C1C}a:hover{color:#7F1D1D}
@keyframes pan{0%{transform:translateX(-90px)}100%{transform:translateX(-380px)}}
.pan{animation:pan 44s ease-in-out infinite alternate}
.pan:hover{animation-play-state:paused}
@keyframes glow{0%{opacity:.35;transform:scale(.96)}100%{opacity:.9;transform:scale(1.04)}}
.glow{animation:glow 2.6s ease-in-out infinite alternate}

.flick{animation:flick 1.3s steps(1) infinite}
@keyframes smoke{0%{transform:translate(0,0) scale(.4);opacity:0}8%{opacity:.8}40%{transform:translate(18px,-66px) scale(1.4);opacity:.6}70%{transform:translate(44px,-118px) scale(2.3);opacity:.35}100%{transform:translate(72px,-170px) scale(3.3);opacity:0}}

.smoke{animation:smoke 6s cubic-bezier(.3,.1,.6,1) infinite}
.smoke2{animation:smoke2 6.8s cubic-bezier(.3,.1,.6,1) infinite}
@keyframes bird{0%{transform:translate(-120px,150px)}100%{transform:translate(1420px,10px)}}
.bird{animation:bird 28s linear infinite}
@keyframes flap{0%,100%{transform:scaleY(1)}50%{transform:scaleY(-.5)}}
.flap{animation:flap .55s ease-in-out infinite;transform-origin:50% 60%}
@keyframes cloud{0%{transform:translate(-520px,0)}100%{transform:translate(1600px,-120px)}}

@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

@keyframes ring{0%{transform:scale(.8);opacity:.8}100%{transform:scale(2.3);opacity:0}}
.ring{animation:ring 1.8s ease-out infinite}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.6)}50%{opacity:.95;transform:scale(1)}}
.tw{animation:twinkle 2.4s ease-in-out infinite}
@keyframes shimmer{0%{background-position:-160px 0}100%{background-position:260px 0}}
.shimmer{background-image:linear-gradient(90deg,rgba(255,255,255,0) 0,rgba(255,255,255,.55) 50%,rgba(255,255,255,0) 100%);background-size:120px 100%;background-repeat:no-repeat;animation:shimmer 1.8s linear infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-60px);opacity:0}}
.spark{animation:rise 1.6s ease-out infinite}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
