<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Colosseum — Arena ranks</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;color:#1C1C1E;background:#F2F2F7;-webkit-font-smoothing:antialiased}
a{color:#1C1C1E}a:hover{color:#000}
button{font-family:inherit}
.glass{background:rgba(255,255,255,0.72);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);border:0.5px solid rgba(255,255,255,0.9);box-shadow:0 1px 1px rgba(0,0,0,0.03),0 8px 24px rgba(0,0,0,0.05)}
.fill{background:rgba(118,118,128,0.12)}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F2F2F7; box-sizing: border-box">
<div style="position: absolute; width: 420px; height: 320px; border-radius: 50%; left: -20px; top: 200px; background: {{blobA}}; filter: blur(90px)"></div>

<div style="position: relative; padding: 62px 20px 0; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; justify-content: space-between; align-items: flex-end">
<div style="display: flex; flex-direction: column; gap: 4px">
<div style="font-size: 13px; color: #6C6C70; font-weight: 500">12 friends</div>
<h1 style="margin: 0; font-size: 34px; font-weight: 700; letter-spacing: -0.8px">Arena</h1>
</div>
<button onClick="{{nextPeriod}}" aria-label="Change period" class="fill" style="height: 36px; padding: 0 12px 0 14px; border-radius: 18px; border: none; display: flex; align-items: center; gap: 4px; font-size: 15px; font-weight: 600; color: #1C1C1E; cursor: pointer">
{{periodLabel}}
<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 10l5 5 5-5"></path></svg>
</button>
</div>

<div role="tablist" aria-label="Arena sections" class="fill" style="height: 36px; border-radius: 18px; padding: 2px; box-sizing: border-box; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px">
<a href="Arena.dc.html" role="tab" aria-selected="true" style="border-radius: 16px; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.08); color: #1C1C1E; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600">Ranks</a>
<a href="Gym.dc.html" role="tab" aria-selected="false" style="border-radius: 16px; color: #1C1C1E; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 500">My gym</a>
</div>

<div role="group" aria-label="Category" style="display: flex; gap: 8px">
<sc-for list="{{lifts}}" as="l" hint-placeholder-count="4">
<button aria-pressed="{{l.on}}" onClick="{{l.pick}}" style="height: 34px; padding: 0 14px; border-radius: 17px; border: none; background: {{l.bg}}; box-shadow: {{l.shadow}}; color: #1C1C1E; font-size: 14px; font-weight: {{l.weight}}; cursor: pointer; white-space: nowrap">{{l.label}}</button>
</sc-for>
</div>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; align-items: end; padding-top: 4px">
<sc-for list="{{podium}}" as="p" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; align-items: center; gap: 8px">
<div style="width: {{p.size}}; height: {{p.size}}; border-radius: 50%; background: #fff; border: {{p.ring}}; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; box-shadow: 0 4px 14px rgba(0,0,0,0.06)">{{p.initials}}</div>
<div style="text-align: center">
<div style="font-size: 14px; font-weight: 600">{{p.name}}</div>
<div style="font-size: 13px; color: #6C6C70">{{p.value}}</div>
</div>
<div class="glass" style="width: 100%; height: {{p.h}}; border-radius: 16px 16px 8px 8px; display: flex; align-items: flex-start; justify-content: center; padding-top: 10px; box-sizing: border-box">
<span style="font-size: 24px; font-weight: 700; color: {{p.numColor}}">{{p.rank}}</span>
</div>
</div>
</sc-for>
</div>

<div class="glass" style="border-radius: 22px; padding: 4px; display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{rest}}" as="r" hint-placeholder-count="4">
<div style="display: flex; align-items: center; gap: 12px; height: 50px; padding: 0 12px; border-radius: 18px; background: {{r.bg}}">
<div style="width: 20px; font-size: 15px; font-weight: 600; color: #6C6C70; font-variant-numeric: tabular-nums">{{r.rank}}</div>
<div class="fill" style="width: 34px; height: 34px; border-radius: 17px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600">{{r.initials}}</div>
<div style="flex-grow: 1; font-size: 15px; font-weight: 600">{{r.name}}</div>
<div style="font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums">{{r.value}}</div>
</div>
</sc-for>
</div>
</div>

<nav aria-label="Tabs" class="glass" style="position: absolute; left: 24px; right: 24px; bottom: 28px; height: 62px; border-radius: 31px; padding: 5px; box-sizing: border-box; display: flex; gap: 2px">
<a href="Main.dc.html" style="flex-grow: 1; flex-basis: 0; border-radius: 26px; color: #6C6C70; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>
<span style="font-size: 10px; font-weight: 600">Today</span>
</a>
<a href="Workouts.dc.html" style="flex-grow: 1; flex-basis: 0; border-radius: 26px; color: #6C6C70; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 7v10M3.5 9.5v5M17.5 7v10M20.5 9.5v5M6.5 12h11"></path></svg>
<span style="font-size: 10px; font-weight: 600">Workouts</span>
</a>
<a href="Arena.dc.html" aria-current="page" style="flex-grow: 1; flex-basis: 0; border-radius: 26px; background: rgba(118,118,128,0.12); color: {{accent}}; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4h8v5a4 4 0 0 1-8 0zM8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8 20h8"></path></svg>
<span style="font-size: 10px; font-weight: 600">Arena</span>
</a>
<a href="Profile.dc.html" style="flex-grow: 1; flex-basis: 0; border-radius: 26px; color: #6C6C70; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4.5 20.5a7.5 7.5 0 0 1 15 0"></path></svg>
<span style="font-size: 10px; font-weight: 600">Profile</span>
</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#B91C1C","options":["#B91C1C","#9F1239","#7F1D1D","#C2410C"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { period: 0, lift: 'volume' };
  }
  renderVals() {
    var self = this;
    var accent = this.props.accent ?? '#B91C1C';
    var h = accent.replace('#', '');
    var r = parseInt(h.substr(0, 2), 16), g = parseInt(h.substr(2, 2), 16), b = parseInt(h.substr(4, 2), 16);
    var tint = function (a) { return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')'; };
    var P = { TK: 'Tomáš', AN: 'Adam', JB: 'Jakub', OS: 'Ondřej', MP: 'You', FH: 'Filip', LV: 'Lukáš', PD: 'Petr' };
    var data = {
      volume: { unit: ' t', rows: [['OS', 24.1], ['MP', 18.4], ['TK', 17.9], ['AN', 16.2], ['JB', 14.8], ['FH', 12.0], ['LV', 9.6]] },
      bench: { unit: ' kg', rows: [['TK', 115], ['AN', 110], ['JB', 105], ['OS', 102.5], ['MP', 100], ['FH', 95], ['LV', 90]] },
      squat: { unit: ' kg', rows: [['AN', 160], ['TK', 150], ['MP', 145], ['JB', 140], ['OS', 135], ['FH', 130], ['LV', 120]] },
      deadlift: { unit: ' kg', rows: [['JB', 200], ['AN', 190], ['TK', 185], ['MP', 180], ['OS', 170], ['FH', 165], ['PD', 150]] }
    };
    var d = data[this.state.lift];
    var fmt = function (v) { return (d.unit === ' t' ? v.toFixed(1) : String(v)) + d.unit; };
    var rows = d.rows.map(function (x, i) { return { rank: i + 1, initials: x[0], name: P[x[0]], you: x[0] === 'MP', value: fmt(x[1]) }; });
    var heights = ['96px', '72px', '56px'];
    var podium = [rows[1], rows[0], rows[2]].map(function (p) {
      var i = p.rank - 1;
      return Object.assign({}, p, {
        h: heights[i], size: i === 0 ? '62px' : '52px',
        ring: i === 0 ? '2.5px solid ' + accent : (p.you ? '2px solid ' + tint(0.45) : '0.5px solid rgba(60,60,67,0.12)'),
        numColor: i === 0 ? accent : '#6C6C70'
      });
    });
    var rest = rows.slice(3).map(function (x) { return Object.assign({}, x, { bg: x.you ? tint(0.08) : 'transparent' }); });
    var lifts = [['volume', 'Volume'], ['bench', 'Bench'], ['squat', 'Squat'], ['deadlift', 'Deadlift']].map(function (l) {
      var on = self.state.lift === l[0];
      return { label: l[1], on: on, bg: on ? '#fff' : 'rgba(118,118,128,0.12)', shadow: on ? '0 2px 6px rgba(0,0,0,0.08)' : 'none', weight: on ? 600 : 500, pick: function () { self.setState({ lift: l[0] }); } };
    });
    var periods = ['This week', 'This month', 'All time'];
    return {
      accent: accent, blobA: tint(0.12), lifts: lifts, podium: podium, rest: rest,
      periodLabel: periods[this.state.period],
      nextPeriod: function () { self.setState({ period: (self.state.period + 1) % 3 }); }
    };
  }
}
</script>
</body>
</html>
