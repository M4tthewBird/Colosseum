<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Colosseum — New program</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;color:#1C1C1E;background:#F2F2F7;-webkit-font-smoothing:antialiased}
a{color:#1C1C1E}a:hover{color:#000}
button,input{font-family:inherit}
.glass{background:rgba(255,255,255,0.72);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);border:0.5px solid rgba(255,255,255,0.9);box-shadow:0 1px 1px rgba(0,0,0,0.03),0 8px 24px rgba(0,0,0,0.05)}
.fill{background:rgba(118,118,128,0.12)}
input::placeholder{color:#8E8E93}
</style>
</helmet>
<div style="width: 390px; height: 960px; position: relative; overflow: hidden; background: #F2F2F7; box-sizing: border-box">
<div style="position: absolute; width: 420px; height: 300px; border-radius: 50%; left: -180px; top: -100px; background: {{blobA}}; filter: blur(80px)"></div>

<div style="position: relative; padding: 58px 20px 40px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; align-items: center; justify-content: space-between">
<a href="Programs.dc.html" class="fill" style="height: 36px; padding: 0 14px; border-radius: 18px; display: flex; align-items: center; font-size: 15px; font-weight: 500; text-decoration: none; color: #1C1C1E">Cancel</a>
<div style="font-size: 17px; font-weight: 600">New program</div>
<a href="Programs.dc.html" class="fill" style="height: 36px; padding: 0 16px; border-radius: 18px; display: flex; align-items: center; font-size: 15px; font-weight: 600; text-decoration: none; color: {{accent}}">Save</a>
</div>

<div class="glass" style="border-radius: 20px; padding: 0 16px; display: flex; flex-direction: column">
<label style="display: flex; align-items: center; height: 50px; gap: 12px; border-bottom: 0.5px solid rgba(60,60,67,0.18)">
<span style="width: 70px; font-size: 16px">Name</span>
<input type="text" value="Push Pull Legs" placeholder="Program name" style="flex-grow: 1; min-width: 0; border: none; background: transparent; font-size: 16px; color: #1C1C1E; outline: none; text-align: right">
</label>
<div style="display: flex; align-items: center; height: 50px; gap: 10px">
<span style="flex-grow: 1; font-size: 16px">Length</span>
<span style="font-size: 16px; color: #6C6C70; font-variant-numeric: tabular-nums">{{weeks}} weeks</span>
<div class="fill" style="height: 32px; border-radius: 16px; display: flex; align-items: center">
<button aria-label="Fewer weeks" onClick="{{lessWeeks}}" style="width: 44px; height: 32px; border: none; background: transparent; font-size: 20px; color: #1C1C1E; cursor: pointer; padding: 0">−</button>
<span style="width: 0.5px; height: 18px; background: rgba(60,60,67,0.25)"></span>
<button aria-label="More weeks" onClick="{{moreWeeks}}" style="width: 44px; height: 32px; border: none; background: transparent; font-size: 20px; color: #1C1C1E; cursor: pointer; padding: 0">+</button>
</div>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; padding: 0 16px; font-size: 13px; color: #6C6C70">
<span>Training days</span><span>{{dayCount}} per week</span>
</div>
<div role="group" aria-label="Training days" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{days}}" as="d" hint-placeholder-count="7">
<button aria-label="{{d.full}}" aria-pressed="{{d.on}}" onClick="{{d.pick}}" style="height: 42px; border-radius: 21px; border: none; background: {{d.bg}}; color: {{d.fg}}; font-size: 14px; font-weight: 600; cursor: pointer; padding: 0">{{d.short}}</button>
</sc-for>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 13px; color: #6C6C70; padding: 0 16px">Workouts</div>

<section class="glass" style="border-radius: 22px; padding: 4px 16px 0; display: flex; flex-direction: column">
<div style="display: flex; align-items: center; gap: 10px; height: 50px; border-bottom: 0.5px solid rgba(60,60,67,0.18)">
<div style="flex-grow: 1; font-size: 17px; font-weight: 600">Push Day</div>
<div style="font-size: 14px; color: #6C6C70">Tue · Fri</div>
</div>
<sc-for list="{{exercises}}" as="e" hint-placeholder-count="4">
<div style="display: flex; align-items: center; gap: 12px; height: 54px; border-bottom: 0.5px solid rgba(60,60,67,0.18)">
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px">
<div style="font-size: 16px">{{e.name}}</div>
<div style="font-size: 12px; color: #6C6C70">{{e.muscle}}</div>
</div>
<div style="font-size: 15px; color: #6C6C70; font-variant-numeric: tabular-nums">{{e.scheme}}</div>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#AEAEB2" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 9h14M5 15h14"></path></svg>
</div>
</sc-for>
<button style="height: 50px; border: none; background: transparent; color: {{accent}}; font-size: 16px; display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 0">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
Add exercise
</button>
</section>

<div class="glass" style="border-radius: 22px; padding: 0 16px; display: flex; flex-direction: column">
<sc-for list="{{otherDays}}" as="d" hint-placeholder-count="2">
<button style="height: 56px; border: none; border-bottom: {{d.divider}}; background: transparent; padding: 0; display: flex; align-items: center; gap: 10px; color: #1C1C1E; cursor: pointer; text-align: left">
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px">
<span style="font-size: 17px; font-weight: 600">{{d.name}}</span>
<span style="font-size: 12px; color: #6C6C70">{{d.meta}}</span>
</span>
<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#AEAEB2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
</button>
</sc-for>
</div>

<button class="fill" style="height: 50px; border-radius: 25px; border: none; color: #1C1C1E; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; margin-top: 4px">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
Add workout day
</button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#B91C1C","options":["#B91C1C","#9F1239","#7F1D1D","#C2410C"]},"$preview":{"width":390,"height":960}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { weeks: 8, days: { mon: true, tue: true, thu: true, fri: true } };
  }
  renderVals() {
    var self = this;
    var accent = this.props.accent ?? '#B91C1C';
    var h = accent.replace('#', '');
    var r = parseInt(h.substr(0, 2), 16), g = parseInt(h.substr(2, 2), 16), b = parseInt(h.substr(4, 2), 16);
    var count = 0;
    var days = [['mon', 'M', 'Monday'], ['tue', 'T', 'Tuesday'], ['wed', 'W', 'Wednesday'], ['thu', 'T', 'Thursday'], ['fri', 'F', 'Friday'], ['sat', 'S', 'Saturday'], ['sun', 'S', 'Sunday']].map(function (d) {
      var on = !!self.state.days[d[0]];
      if (on) count++;
      return {
        short: d[1], full: d[2], on: on, bg: on ? accent : 'rgba(118,118,128,0.12)', fg: on ? '#fff' : '#1C1C1E',
        pick: function () { var ds = Object.assign({}, self.state.days); ds[d[0]] = !ds[d[0]]; self.setState({ days: ds }); }
      };
    });
    var exercises = [
      { name: 'Bench press', muscle: 'Chest', scheme: '4 × 6–8' },
      { name: 'Overhead press', muscle: 'Shoulders', scheme: '3 × 8' },
      { name: 'Incline dumbbell press', muscle: 'Upper chest', scheme: '3 × 10' },
      { name: 'Triceps pushdown', muscle: 'Triceps', scheme: '3 × 12' }
    ];
    var otherDays = [
      { name: 'Pull Day', meta: 'Mon · Thu · 5 exercises' },
      { name: 'Leg Day', meta: 'Every other Thu · 5 exercises' }
    ].map(function (d, i, a) { return Object.assign({}, d, { divider: i < a.length - 1 ? '0.5px solid rgba(60,60,67,0.18)' : 'none' }); });
    return {
      accent: accent, blobA: 'rgba(' + r + ',' + g + ',' + b + ',0.12)',
      weeks: this.state.weeks, dayCount: count, days: days, exercises: exercises, otherDays: otherDays,
      lessWeeks: function () { self.setState({ weeks: Math.max(1, self.state.weeks - 1) }); },
      moreWeeks: function () { self.setState({ weeks: Math.min(52, self.state.weeks + 1) }); }
    };
  }
}
</script>
</body>
</html>
