<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Colosseum — Today</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&amp;display=swap">
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;color:#1C1C1E;background:#F2F2F7;-webkit-font-smoothing:antialiased}
a{color:#1C1C1E}a:hover{color:#000}
button,input{font-family:inherit}
.glass{background:rgba(255,255,255,0.72);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);border:0.5px solid rgba(255,255,255,0.9);box-shadow:0 1px 1px rgba(0,0,0,0.03),0 8px 24px rgba(0,0,0,0.05)}
.fill{background:rgba(118,118,128,0.12)}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F2F2F7; box-sizing: border-box">
<div style="position: absolute; width: 420px; height: 300px; border-radius: 50%; right: -160px; top: -140px; background: {{blobA}}; filter: blur(80px)"></div>

<div style="position: relative; padding: 62px 20px 0; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; justify-content: space-between; align-items: flex-end">
<div style="display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; align-items: center; gap: 6px; font-family: 'Cinzel', serif; font-weight: 700; font-size: 12px; letter-spacing: 3px; color: {{accent}}"><svg width="16" height="16" viewBox="0 0 100 100" aria-hidden="true"><defs><mask id="mkM"><rect width="100" height="100" fill="#fff"></rect><path fill="#000" d="M20 84V70a8 8 0 0 1 16 0v14zM42 84V70a8 8 0 0 1 16 0v14zM64 84V70a8 8 0 0 1 16 0v14zM20 36V30a8 8 0 0 1 16 0v6zM42 36V30a8 8 0 0 1 16 0v6zM64 36V30a8 8 0 0 1 16 0v6zM0 43h100v14H0z"></path></mask></defs><path d="M12 88V22q0-6 6-6h28l42 27v45z" fill="currentColor" mask="url(#mkM)"></path><rect x="3" y="48" width="94" height="4" rx="2" fill="currentColor"></rect><rect x="3" y="38" width="7" height="24" rx="2" fill="currentColor"></rect><rect x="90" y="38" width="7" height="24" rx="2" fill="currentColor"></rect></svg>COLOSSEUM</div>
<h1 style="margin: 0; font-size: 34px; font-weight: 700; letter-spacing: -0.8px">Today</h1>
</div>
<a href="Profile.dc.html" aria-label="Profile" class="fill" style="width: 40px; height: 40px; border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; text-decoration: none; color: #1C1C1E">MP</a>
</div>

<section class="glass" style="border-radius: 24px; padding: 18px; display: flex; gap: 20px; align-items: center">
<div style="position: relative; width: 80px; height: 80px; flex-shrink: 0">
<svg width="80" height="80" viewBox="0 0 80 80" aria-hidden="true">
<circle cx="40" cy="40" r="33" fill="none" stroke="rgba(118,118,128,0.14)" stroke-width="7"></circle>
<circle cx="40" cy="40" r="33" fill="none" stroke="{{accent}}" stroke-width="7" stroke-linecap="round" stroke-dasharray="155.5 207.3" transform="rotate(-90 40 40)"></circle>
</svg>
<div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center">
<div style="font-size: 20px; font-weight: 700; letter-spacing: -0.4px">3/4</div>
<div style="font-size: 10px; color: #6C6C70; font-weight: 500">workouts</div>
</div>
</div>
<div style="flex-grow: 1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<div><div style="font-size: 19px; font-weight: 700; letter-spacing: -0.4px">18.4 t</div><div style="font-size: 12px; color: #6C6C70">Volume</div></div>
<div><div style="font-size: 19px; font-weight: 700; letter-spacing: -0.4px">6 wk</div><div style="font-size: 12px; color: #6C6C70">Streak</div></div>
<div><div style="font-size: 19px; font-weight: 700; letter-spacing: -0.4px">#2</div><div style="font-size: 12px; color: #6C6C70">Arena rank</div></div>
<div><div style="font-size: 19px; font-weight: 700; letter-spacing: -0.4px">2</div><div style="font-size: 12px; color: #6C6C70">New PRs</div></div>
</div>
</section>

<section class="glass" style="border-radius: 24px; padding: 18px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; justify-content: space-between; align-items: flex-start">
<div style="display: flex; flex-direction: column; gap: 3px">
<div style="font-size: 13px; font-weight: 600; color: #6C6C70">Up next</div>
<h2 style="margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.4px">Push Day</h2>
<div style="font-size: 13px; color: #6C6C70">5 exercises · about 55 min</div>
</div>
<a href="Programs.dc.html" style="font-size: 15px; color: #6C6C70; text-decoration: none">Change</a>
</div>
<a href="Workout.dc.html" class="fill" style="height: 50px; border-radius: 25px; color: #1C1C1E; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 17px; font-weight: 600">
<svg width="15" height="15" viewBox="0 0 24 24" fill="{{accent}}" aria-hidden="true"><path d="M7 4.5v15l12-7.5z"></path></svg>
Start workout
</a>
</section>

<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; align-items: baseline; padding: 0 4px">
<h2 style="margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -0.3px">Friends' PRs</h2>
<a href="Arena.dc.html" style="font-size: 15px; text-decoration: none; color: #6C6C70">Arena</a>
</div>
<div class="glass" style="border-radius: 22px; padding: 2px 16px; display: flex; flex-direction: column">
<sc-for list="{{feed}}" as="f" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 12px; height: 62px; border-bottom: {{f.divider}}">
<div class="fill" style="width: 38px; height: 38px; border-radius: 19px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; flex-shrink: 0">{{f.initials}}</div>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0">
<div style="font-size: 15px; font-weight: 600">{{f.name}} <span style="font-weight: 400; color: #6C6C70">· {{f.lift}}</span></div>
<div style="font-size: 13px; color: #6C6C70">{{f.time}}</div>
</div>
<div style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px">
<div style="font-size: 15px; font-weight: 700">{{f.value}}</div>
<div style="font-size: 11px; font-weight: 600; color: {{accent}}">New PR</div>
</div>
</div>
</sc-for>
</div>
</div>
</div>

<nav aria-label="Tabs" class="glass" style="position: absolute; left: 24px; right: 24px; bottom: 28px; height: 62px; border-radius: 31px; padding: 5px; box-sizing: border-box; display: flex; gap: 2px">
<a href="Main.dc.html" aria-current="page" style="flex-grow: 1; flex-basis: 0; border-radius: 26px; background: rgba(118,118,128,0.12); color: {{accent}}; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>
<span style="font-size: 10px; font-weight: 600">Today</span>
</a>
<a href="Workouts.dc.html" style="flex-grow: 1; flex-basis: 0; border-radius: 26px; color: #6C6C70; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 7v10M3.5 9.5v5M17.5 7v10M20.5 9.5v5M6.5 12h11"></path></svg>
<span style="font-size: 10px; font-weight: 600">Workouts</span>
</a>
<a href="Arena.dc.html" style="flex-grow: 1; flex-basis: 0; border-radius: 26px; color: #6C6C70; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4h8v5a4 4 0 0 1-8 0zM8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8 20h8"></path></svg>
<span style="font-size: 10px; font-weight: 600">Arena</span>
</a>
<a href="Profile.dc.html" style="flex-grow: 1; flex-basis: 0; border-radius: 26px; color: #6C6C70; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4.5 20.5a7.5 7.5 0 0 1 15 0"></path></svg>
<span style="font-size: 10px; font-weight: 600">Profile</span>
</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#B91C1C","options":["#B91C1C","#9F1239","#7F1D1D","#C2410C"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var accent = this.props.accent ?? '#B91C1C';
    var h = accent.replace('#', '');
    var r = parseInt(h.substr(0, 2), 16), g = parseInt(h.substr(2, 2), 16), b = parseInt(h.substr(4, 2), 16);
    var feed = [
      { initials: 'TK', name: 'Tomáš', lift: 'Bench press', time: '2 h ago', value: '115 kg' },
      { initials: 'AN', name: 'Adam', lift: 'Squat', time: '5 h ago', value: '160 kg' },
      { initials: 'JB', name: 'Jakub', lift: 'Deadlift', time: 'Yesterday', value: '200 kg' }
    ].map(function (f, i, a) { return Object.assign({}, f, { divider: i < a.length - 1 ? '0.5px solid rgba(60,60,67,0.18)' : 'none' }); });
    return { accent: accent, blobA: 'rgba(' + r + ',' + g + ',' + b + ',0.14)', feed: feed };
  }
}
</script>
</body>
</html>
