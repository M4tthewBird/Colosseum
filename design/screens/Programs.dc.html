<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Colosseum — Programs</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;color:#1C1C1E;background:#F2F2F7;-webkit-font-smoothing:antialiased}
a{color:#1C1C1E}a:hover{color:#000}
button{font-family:inherit}
.glass{background:rgba(255,255,255,0.72);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);border:0.5px solid rgba(255,255,255,0.9);box-shadow:0 1px 1px rgba(0,0,0,0.03),0 8px 24px rgba(0,0,0,0.05)}
.fill{background:rgba(118,118,128,0.12)}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F2F2F7; box-sizing: border-box">
<div style="position: absolute; width: 420px; height: 300px; border-radius: 50%; right: -160px; top: -120px; background: {{blobA}}; filter: blur(80px)"></div>

<div style="position: relative; padding: 58px 20px 0; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; justify-content: space-between; align-items: center">
<a href="Workouts.dc.html" style="font-size: 17px; color: {{accent}}; text-decoration: none; display: flex; align-items: center; gap: 2px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>Workouts
</a>
<a href="ProgramEdit.dc.html" aria-label="New program" class="fill" style="width: 36px; height: 36px; border-radius: 18px; display: flex; align-items: center; justify-content: center; color: #1C1C1E">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
</a>
</div>
<h1 style="margin: -8px 0 0; font-size: 34px; font-weight: 700; letter-spacing: -0.8px">Programs</h1>

<section class="glass" style="border-radius: 24px; padding: 18px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; justify-content: space-between; align-items: flex-start">
<div style="display: flex; flex-direction: column; gap: 3px">
<div style="font-size: 13px; font-weight: 600; color: {{accent}}">Active</div>
<h2 style="margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.4px">Push Pull Legs</h2>
<div style="font-size: 13px; color: #6C6C70">4 days a week · 8 weeks</div>
</div>
<a href="ProgramEdit.dc.html" style="font-size: 15px; color: #6C6C70; text-decoration: none">Edit</a>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; font-size: 12px; color: #6C6C70">
<span>Week 3 of 8</span><span>9 of 32 workouts</span>
</div>
<div class="fill" style="height: 6px; border-radius: 3px; overflow: hidden">
<div style="width: 28%; height: 6px; border-radius: 3px; background: {{accent}}"></div>
</div>
</div>
<div aria-label="This week" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{week}}" as="d" hint-placeholder-count="7">
<div style="display: flex; flex-direction: column; align-items: center; gap: 5px">
<div style="font-size: 11px; font-weight: 600; color: #6C6C70">{{d.day}}</div>
<div style="width: 34px; height: 34px; border-radius: 17px; background: {{d.bg}}; color: {{d.fg}}; border: {{d.border}}; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600">{{d.label}}</div>
</div>
</sc-for>
</div>
</section>

<div style="display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0; padding: 0 4px; font-size: 20px; font-weight: 700; letter-spacing: -0.3px">My programs</h2>
<div class="glass" style="border-radius: 22px; padding: 2px 16px; display: flex; flex-direction: column">
<sc-for list="{{programs}}" as="p" hint-placeholder-count="3">
<a href="ProgramEdit.dc.html" style="display: flex; align-items: center; gap: 12px; height: 60px; text-decoration: none; color: #1C1C1E; border-bottom: {{p.divider}}">
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 16px; font-weight: 600">{{p.name}}</div>
<div style="font-size: 13px; color: #6C6C70">{{p.meta}}</div>
</div>
<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#AEAEB2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
</a>
</sc-for>
</div>
<a href="ProgramEdit.dc.html" class="fill" style="height: 50px; border-radius: 25px; color: #1C1C1E; text-decoration: none; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 6px">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
Create program
</a>
</div>
</div>

<nav aria-label="Tabs" class="glass" style="position: absolute; left: 24px; right: 24px; bottom: 28px; height: 62px; border-radius: 31px; padding: 5px; box-sizing: border-box; display: flex; gap: 2px">
<a href="Main.dc.html" style="flex-grow: 1; flex-basis: 0; border-radius: 26px; color: #6C6C70; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>
<span style="font-size: 10px; font-weight: 600">Today</span>
</a>
<a href="Workouts.dc.html" aria-current="page" style="flex-grow: 1; flex-basis: 0; border-radius: 26px; background: rgba(118,118,128,0.12); color: {{accent}}; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 7v10M3.5 9.5v5M17.5 7v10M20.5 9.5v5M6.5 12h11"></path></svg>
<span style="font-size: 10px; font-weight: 600">Workouts</span>
</a>
<a href="Arena.dc.html" style="flex-grow: 1; flex-basis: 0; border-radius: 26px; color: #6C6C70; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4h8v5a4 4 0 0 1-8 0zM8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8 20h8"></path></svg>
<span style="font-size: 10px; font-weight: 600">Arena</span>
</a>
<a href="Profile.dc.html" style="flex-grow: 1; flex-basis: 0; border-radius: 26px; color: #6C6C70; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4.5 20.5a7.5 7.5 0 0 1 15 0"></path></svg>
<span style="font-size: 10px; font-weight: 600">Profile</span>
</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#B91C1C","options":["#B91C1C","#9F1239","#7F1D1D","#C2410C"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var accent = this.props.accent ?? '#B91C1C';
    var h = accent.replace('#', '');
    var r = parseInt(h.substr(0, 2), 16), g = parseInt(h.substr(2, 2), 16), b = parseInt(h.substr(4, 2), 16);
    var plan = [['M', 'Pl', 'done'], ['T', 'Pu', 'today'], ['W', '', 'rest'], ['T', 'Lg', 'next'], ['F', 'Pl', 'next'], ['S', '', 'rest'], ['S', '', 'rest']];
    var week = plan.map(function (d) {
      var s = d[2];
      return {
        day: d[0],
        label: s === 'rest' ? '' : d[1],
        bg: s === 'done' ? 'rgba(118,118,128,0.18)' : (s === 'today' ? accent : 'transparent'),
        fg: s === 'today' ? '#fff' : (s === 'done' ? '#1C1C1E' : '#6C6C70'),
        border: s === 'next' ? '1px dashed rgba(60,60,67,0.3)' : 'none'
      };
    });
    var programs = [
      { name: 'Upper / Lower', meta: '4 days · 10 weeks · finished' },
      { name: '5 × 5 Strength', meta: '3 days · 12 weeks' },
      { name: 'Arms & Shoulders', meta: '2 days · add-on' }
    ].map(function (p, i, a) { return Object.assign({}, p, { divider: i < a.length - 1 ? '0.5px solid rgba(60,60,67,0.18)' : 'none' }); });
    return { accent: accent, blobA: 'rgba(' + r + ',' + g + ',' + b + ',0.14)', week: week, programs: programs };
  }
}
</script>
</body>
</html>
