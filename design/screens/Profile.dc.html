<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Colosseum — Profile: body</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;color:#1C1C1E;background:#F2F2F7;-webkit-font-smoothing:antialiased}
a{color:#1C1C1E}a:hover{color:#000}
button{font-family:inherit}
.glass{background:rgba(255,255,255,0.72);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);border:0.5px solid rgba(255,255,255,0.9);box-shadow:0 1px 1px rgba(0,0,0,0.03),0 8px 24px rgba(0,0,0,0.05)}
.fill{background:rgba(118,118,128,0.12)}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F2F2F7; box-sizing: border-box">
<div style="position: absolute; width: 420px; height: 300px; border-radius: 50%; right: -160px; top: -120px; background: {{blobA}}; filter: blur(80px)"></div>

<div style="position: relative; padding: 62px 20px 0; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; justify-content: space-between; align-items: flex-end">
<h1 style="margin: 0; font-size: 34px; font-weight: 700; letter-spacing: -0.8px">Profile</h1>
<button aria-label="Settings" class="fill" style="width: 36px; height: 36px; border-radius: 18px; border: none; display: flex; align-items: center; justify-content: center; color: #1C1C1E; cursor: pointer; padding: 0">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg>
</button>
</div>

<section class="glass" style="border-radius: 22px; padding: 14px 16px; display: flex; align-items: center; gap: 14px">
<div class="fill" style="width: 54px; height: 54px; border-radius: 27px; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 600; flex-shrink: 0">MP</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 18px; font-weight: 600; letter-spacing: -0.3px">Matyáš</div>
<div style="font-size: 13px; color: #6C6C70">@matyas · Iron Forum</div>
</div>
</section>

<div role="tablist" aria-label="Profile sections" class="fill" style="height: 36px; border-radius: 18px; padding: 2px; box-sizing: border-box; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px">
<a href="Profile.dc.html" role="tab" aria-selected="true" style="border-radius: 16px; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.08); color: #1C1C1E; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600">Body</a>
<a href="ProfileLifts.dc.html" role="tab" aria-selected="false" style="border-radius: 16px; color: #1C1C1E; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 500">Lifts</a>
</div>

<section class="glass" style="border-radius: 22px; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 13px; font-weight: 600; color: #6C6C70">Bodyweight</div>
<div style="font-size: 26px; font-weight: 700; letter-spacing: -0.6px">82.4 <span style="font-size: 15px; font-weight: 600; color: #6C6C70">kg</span></div>
<div style="font-size: 12px; color: #6C6C70">−1.2 kg in 30 days</div>
</div>
<svg width="120" height="40" viewBox="0 0 120 40" role="img" aria-label="Bodyweight trending down from 83.6 to 82.4 kg" style="overflow: visible">
<polyline points="0,6.5 17,11 34,8.75 51,17.75 69,22.25 86,24.5 103,29 120,33.5" fill="none" stroke="{{accent}}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"></polyline>
<circle cx="120" cy="33.5" r="4" fill="#fff" stroke="{{accent}}" stroke-width="2.5"></circle>
</svg>
</section>

<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; align-items: center; padding: 0 4px">
<h2 style="margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -0.3px">Measurements</h2>
<button class="fill" style="height: 30px; padding: 0 12px; border-radius: 15px; border: none; color: #1C1C1E; font-size: 14px; font-weight: 600; cursor: pointer">Log</button>
</div>
<div class="glass" style="border-radius: 22px; padding: 2px 16px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 20px">
<sc-for list="{{measures}}" as="m" hint-placeholder-count="8">
<div style="height: 50px; display: flex; align-items: center; justify-content: space-between; border-bottom: {{m.divider}}">
<div style="display: flex; flex-direction: column">
<div style="font-size: 12px; color: #6C6C70">{{m.label}}</div>
<div style="font-size: 16px; font-weight: 600">{{m.value}} <span style="font-size: 12px; font-weight: 500; color: #6C6C70">cm</span></div>
</div>
<div style="font-size: 12px; font-weight: 600; color: {{m.color}}">{{m.delta}}</div>
</div>
</sc-for>
</div>
<div style="font-size: 12px; color: #6C6C70; padding: 0 4px">Last logged 12 Sep · change since previous entry</div>
</div>
</div>

<nav aria-label="Tabs" class="glass" style="position: absolute; left: 24px; right: 24px; bottom: 28px; height: 62px; border-radius: 31px; padding: 5px; box-sizing: border-box; display: flex; gap: 2px">
<a href="Main.dc.html" style="flex-grow: 1; flex-basis: 0; border-radius: 26px; color: #6C6C70; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>
<span style="font-size: 10px; font-weight: 600">Today</span>
</a>
<a href="Workouts.dc.html" style="flex-grow: 1; flex-basis: 0; border-radius: 26px; color: #6C6C70; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 7v10M3.5 9.5v5M17.5 7v10M20.5 9.5v5M6.5 12h11"></path></svg>
<span style="font-size: 10px; font-weight: 600">Workouts</span>
</a>
<a href="Arena.dc.html" style="flex-grow: 1; flex-basis: 0; border-radius: 26px; color: #6C6C70; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4h8v5a4 4 0 0 1-8 0zM8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8 20h8"></path></svg>
<span style="font-size: 10px; font-weight: 600">Arena</span>
</a>
<a href="Profile.dc.html" aria-current="page" style="flex-grow: 1; flex-basis: 0; border-radius: 26px; background: rgba(118,118,128,0.12); color: {{accent}}; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4.5 20.5a7.5 7.5 0 0 1 15 0"></path></svg>
<span style="font-size: 10px; font-weight: 600">Profile</span>
</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#B91C1C","options":["#B91C1C","#9F1239","#7F1D1D","#C2410C"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var accent = this.props.accent ?? '#B91C1C';
    var h = accent.replace('#', '');
    var r = parseInt(h.substr(0, 2), 16), g = parseInt(h.substr(2, 2), 16), b = parseInt(h.substr(4, 2), 16);
    var measures = [
      ['Chest', 104.0, 1.0], ['Shoulders', 123.5, 1.5],
      ['Biceps L', 38.5, 0.5], ['Biceps R', 39.0, 0.5],
      ['Forearms', 31.0, 0], ['Waist', 81.0, -1.5],
      ['Thighs', 60.5, 1.0], ['Calves', 39.0, 0.5]
    ].map(function (m, i, a) {
      return {
        label: m[0], value: m[1].toFixed(1),
        delta: m[2] === 0 ? '—' : (m[2] > 0 ? '+' : '−') + Math.abs(m[2]).toFixed(1),
        color: m[2] === 0 ? '#6C6C70' : accent,
        divider: i < a.length - 2 ? '0.5px solid rgba(60,60,67,0.18)' : 'none'
      };
    });
    return { accent: accent, blobA: 'rgba(' + r + ',' + g + ',' + b + ',0.14)', measures: measures };
  }
}
</script>
</body>
</html>
