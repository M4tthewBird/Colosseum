<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Colosseum — Arena: my gym</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;color:#1C1C1E;background:#F2F2F7;-webkit-font-smoothing:antialiased}
a{color:#1C1C1E}a:hover{color:#000}
button{font-family:inherit}
.glass{background:rgba(255,255,255,0.72);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);border:0.5px solid rgba(255,255,255,0.9);box-shadow:0 1px 1px rgba(0,0,0,0.03),0 8px 24px rgba(0,0,0,0.05)}
.fill{background:rgba(118,118,128,0.12)}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F2F2F7; box-sizing: border-box">
<div style="position: absolute; width: 420px; height: 300px; border-radius: 50%; right: -160px; top: -120px; background: {{blobA}}; filter: blur(80px)"></div>

<div style="position: relative; padding: 62px 20px 0; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; justify-content: space-between; align-items: flex-end">
<div style="display: flex; flex-direction: column; gap: 4px">
<div style="font-size: 13px; color: #6C6C70; font-weight: 500">Iron Forum · 248 members</div>
<h1 style="margin: 0; font-size: 34px; font-weight: 700; letter-spacing: -0.8px">Arena</h1>
</div>
<button onClick="{{checkIn}}" aria-pressed="{{checkedIn}}" class="fill" style="height: 36px; padding: 0 14px; border-radius: 18px; border: none; display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 600; color: #1C1C1E; cursor: pointer">
<sc-if value="{{checkedIn}}" hint-placeholder-val="{{ false }}">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
</sc-if>
{{checkLabel}}
</button>
</div>

<div role="tablist" aria-label="Arena sections" class="fill" style="height: 36px; border-radius: 18px; padding: 2px; box-sizing: border-box; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px">
<a href="Arena.dc.html" role="tab" aria-selected="false" style="border-radius: 16px; color: #1C1C1E; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 500">Ranks</a>
<a href="Gym.dc.html" role="tab" aria-selected="true" style="border-radius: 16px; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.08); color: #1C1C1E; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600">My gym</a>
</div>

<section class="glass" style="border-radius: 22px; height: 64px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600">
<span style="width: 8px; height: 8px; border-radius: 4px; background: #16A34A"></span>31 training now
</div>
<div style="display: flex">
<div class="fill" style="width: 30px; height: 30px; border-radius: 15px; border: 2px solid #fff; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 600">TK</div>
<div class="fill" style="width: 30px; height: 30px; border-radius: 15px; border: 2px solid #fff; margin-left: -8px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 600">AN</div>
<div class="fill" style="width: 30px; height: 30px; border-radius: 15px; border: 2px solid #fff; margin-left: -8px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 600">JB</div>
<div style="width: 30px; height: 30px; border-radius: 15px; border: 2px solid #fff; margin-left: -8px; background: #E5E5EA; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 600; color: #6C6C70">+28</div>
</div>
</section>

<section class="glass" style="border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 13px; font-weight: 600; color: #6C6C70">Gym challenge</div>
<div style="font-size: 17px; font-weight: 700">10,000 pull-ups together</div>
</div>
<div style="font-size: 13px; color: #6C6C70">12 days left</div>
</div>
<div class="fill" style="height: 6px; border-radius: 3px; overflow: hidden">
<div style="width: 64%; height: 6px; border-radius: 3px; background: {{accent}}"></div>
</div>
<div style="display: flex; justify-content: space-between; font-size: 13px; color: #6C6C70"><span>Gym <span style="color: #1C1C1E; font-weight: 600">6,420 / 10,000</span></span><span>You <span style="color: #1C1C1E; font-weight: 600">182</span></span></div>
</section>

<div style="display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{posts}}" as="p" hint-placeholder-count="2">
<article class="glass" style="border-radius: 22px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; gap: 10px">
<div class="fill" style="width: 36px; height: 36px; border-radius: 18px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600">{{p.initials}}</div>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px">
<div style="font-size: 15px; font-weight: 600">{{p.name}} <span style="font-weight: 400; color: #6C6C70">finished {{p.workout}}</span></div>
<div style="font-size: 12px; color: #6C6C70">{{p.time}}</div>
</div>
</div>
<div style="display: flex; gap: 18px; font-size: 13px; color: #6C6C70">
<span><span style="color: #1C1C1E; font-weight: 600">{{p.duration}}</span></span>
<span><span style="color: #1C1C1E; font-weight: 600">{{p.volume}}</span> volume</span>
<span><span style="color: {{accent}}; font-weight: 600">{{p.prs}}</span> PRs</span>
</div>
<div style="display: flex; gap: 8px">
<button aria-pressed="{{p.on}}" onClick="{{p.salute}}" class="fill" style="height: 32px; padding: 0 12px; border-radius: 16px; border: none; color: {{p.fg}}; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; cursor: pointer">
<svg width="14" height="14" viewBox="0 0 24 24" fill="{{p.iconFill}}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg>
{{p.count}}
</button>
<button class="fill" style="height: 32px; padding: 0 12px; border-radius: 16px; border: none; color: #1C1C1E; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; cursor: pointer">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 0 1-11.6 7.1L4 20l1-4.2A8 8 0 1 1 20 12z"></path></svg>
{{p.comments}}
</button>
</div>
</article>
</sc-for>
</div>
</div>

<nav aria-label="Tabs" class="glass" style="position: absolute; left: 24px; right: 24px; bottom: 28px; height: 62px; border-radius: 31px; padding: 5px; box-sizing: border-box; display: flex; gap: 2px">
<a href="Main.dc.html" style="flex-grow: 1; flex-basis: 0; border-radius: 26px; color: #6C6C70; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>
<span style="font-size: 10px; font-weight: 600">Today</span>
</a>
<a href="Workouts.dc.html" style="flex-grow: 1; flex-basis: 0; border-radius: 26px; color: #6C6C70; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 7v10M3.5 9.5v5M17.5 7v10M20.5 9.5v5M6.5 12h11"></path></svg>
<span style="font-size: 10px; font-weight: 600">Workouts</span>
</a>
<a href="Arena.dc.html" aria-current="page" style="flex-grow: 1; flex-basis: 0; border-radius: 26px; background: rgba(118,118,128,0.12); color: {{accent}}; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4h8v5a4 4 0 0 1-8 0zM8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8 20h8"></path></svg>
<span style="font-size: 10px; font-weight: 600">Arena</span>
</a>
<a href="Profile.dc.html" style="flex-grow: 1; flex-basis: 0; border-radius: 26px; color: #6C6C70; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4.5 20.5a7.5 7.5 0 0 1 15 0"></path></svg>
<span style="font-size: 10px; font-weight: 600">Profile</span>
</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#B91C1C","options":["#B91C1C","#9F1239","#7F1D1D","#C2410C"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { checkedIn: false, liked: { 0: true } };
  }
  renderVals() {
    var self = this;
    var accent = this.props.accent ?? '#B91C1C';
    var h = accent.replace('#', '');
    var r = parseInt(h.substr(0, 2), 16), g = parseInt(h.substr(2, 2), 16), b = parseInt(h.substr(4, 2), 16);
    var posts = [
      { initials: 'OS', name: 'Ondřej', workout: 'Pull Day', time: '35 min ago', duration: '58 min', volume: '12.4 t', prs: 2, base: 14, comments: 3 },
      { initials: 'FH', name: 'Filip', workout: 'Leg Day', time: '1 h ago', duration: '1 h 12 min', volume: '16.1 t', prs: 1, base: 8, comments: 1 }
    ].map(function (p, i) {
      var on = !!self.state.liked[i];
      return Object.assign({}, p, {
        on: on, count: p.base + (on ? 1 : 0), fg: on ? accent : '#1C1C1E', iconFill: on ? accent : 'none',
        salute: function () { var s = Object.assign({}, self.state.liked); s[i] = !s[i]; self.setState({ liked: s }); }
      });
    });
    var c = this.state.checkedIn;
    return {
      accent: accent, blobA: 'rgba(' + r + ',' + g + ',' + b + ',0.14)', posts: posts,
      checkedIn: c, checkLabel: c ? 'Checked in' : 'Check in',
      checkIn: function () { self.setState({ checkedIn: !self.state.checkedIn }); }
    };
  }
}
</script>
</body>
</html>
